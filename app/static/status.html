<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>实时速率</title>
<style>
:root {
  --page: transparent;
  --panel: #0B1220; --row: #111A2E; --row-hover: #16213A; --line: #1E293B;
  --text: #F1F5F9; --muted: #94A3B8; --faint: #64748B;
  --rx: #2DD4BF; --tx: #60A5FA; --ok: #4ADE80; --off: #334155;
}
:root[data-theme="light"] {
  --panel: #FFFFFF; --row: #F8FAFC; --row-hover: #F1F5F9; --line: #E2E8F0;
  --text: #0F172A; --muted: #64748B; --faint: #94A3B8;
  --rx: #0D9488; --tx: #2563EB; --ok: #16A34A; --off: #CBD5E1;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --panel: #FFFFFF; --row: #F8FAFC; --row-hover: #F1F5F9; --line: #E2E8F0;
    --text: #0F172A; --muted: #64748B; --faint: #94A3B8;
    --rx: #0D9488; --tx: #2563EB; --ok: #16A34A; --off: #CBD5E1;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
.num, .v, .clock { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.title { font-size: 15px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 12px; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em;
  color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; position: relative; }
.live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid currentColor; animation: ping 1.6s ease-out infinite; }
.live .clock { font-weight: 500; letter-spacing: 0; color: var(--muted); }
.live.stale { color: var(--faint); border-color: var(--line); }
.live.stale i::after { animation: none; opacity: 0; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(1.8); opacity: 0 } }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 12px; }
.stat { padding: 10px 12px; border-radius: 10px; background: var(--row); border: 1px solid var(--line); min-width: 0; }
.stat .k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.stat .k b { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; white-space: nowrap; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }

.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(110px, 1.1fr) minmax(120px, 2.2fr) 118px 118px; align-items: center; gap: 14px;
  padding: 8px 12px; border-radius: 10px; background: var(--row); border: 1px solid var(--line); transition: background .2s; }
.row:hover { background: var(--row-hover); }
.row.offline { opacity: .6; }
.gname { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--off); }
.dots i.on { background: var(--ok); }
.dots span { margin-left: 4px; }
svg.chart { width: 100%; height: 38px; display: block; }
.num { text-align: right; white-space: nowrap; }
.num .lbl { display: block; font-size: 11px; color: var(--muted); }
.num .lbl::before { content: ""; display: inline-block; width: 0; height: 0; margin-right: 5px; vertical-align: 1px;
  border-left: 4px solid transparent; border-right: 4px solid transparent; }
.num.rx .lbl::before { border-top: 6px solid var(--rx); }
.num.tx .lbl::before { border-bottom: 6px solid var(--tx); }
.num b { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.num small { font-size: 11.5px; color: var(--muted); margin-left: 3px; }

.foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 11.5px; color: var(--faint); }
.legend { display: flex; gap: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 2px; margin-right: 5px; vertical-align: 3px; }
.legend .l-rx::before { background: var(--rx); }
.legend .l-tx::before { background: var(--tx); }
.msg { color: var(--muted); padding: 22px 4px; text-align: center; }

@media (max-width: 560px) {
  .panel { padding: 14px 12px 12px; }
  .summary { gap: 6px; }
  .stat { padding: 8px 9px; }
  .stat .v { font-size: 18px; }
  .row { grid-template-columns: 1fr auto auto; grid-template-areas: "g rx tx" "c c c"; gap: 6px 12px; }
  .row .g { grid-area: g; } .row .chart { grid-area: c; height: 30px; }
  .row .num.rx { grid-area: rx; } .row .num.tx { grid-area: tx; }
  .num b { font-size: 16px; }
  .foot .legend { display: none; }
  .live .clock { display: none; }
}
</style>
</head>
<body>
<div class="panel">
  <header class="head">
    <div class="brand">
      <svg viewBox="0 0 120 120" width="30" height="30" aria-hidden="true">
        <g fill="none" stroke-width="7" stroke-linecap="round">
          <ellipse cx="60" cy="60" rx="52" ry="18" transform="rotate(60 60 60)" stroke="currentColor"></ellipse>
          <ellipse cx="60" cy="60" rx="52" ry="18" transform="rotate(120 60 60)" stroke="currentColor"></ellipse>
          <path d="M14.09 51.55 A52 18 0 1 1 11.13 66.16" stroke="var(--rx)"></path>
        </g>
        <polygon points="2.6,59.4 18.4,62.7 6.6,74.6" fill="var(--rx)"></polygon>
        <circle cx="60" cy="60" r="11" fill="var(--rx)"></circle>
      </svg>
      <div style="min-width:0">
        <div class="title" id="title">实时速率</div>
        <div class="sub">入口节点 · 每秒更新</div>
      </div>
    </div>
    <div class="live" id="live"><i></i>LIVE <span class="clock" id="clock">--:--:--</span></div>
  </header>

  <section class="summary" aria-label="合计">
    <div class="stat"><div class="k"><b style="background:var(--rx)"></b>总下行</div><div class="v"><span id="sum-rx">0</span><small id="sum-rx-u">Mbps</small></div></div>
    <div class="stat"><div class="k"><b style="background:var(--tx)"></b>总上行</div><div class="v"><span id="sum-tx">0</span><small id="sum-tx-u">Mbps</small></div></div>
    <div class="stat"><div class="k"><b style="background:var(--ok)"></b>在线节点</div><div class="v"><span id="sum-on">0</span><small id="sum-total">/ 0</small></div></div>
  </section>

  <section class="rows" id="rows" aria-label="各组速率"></section>
  <div class="msg" id="msg" hidden></div>

  <footer class="foot">
    <span class="legend"><span class="l-rx">下行</span><span class="l-tx">上行</span><span>最近 60 秒</span></span>
    <span id="foot-note">连接中…</span>
  </footer>
</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const theme = ["light", "dark", "auto"].includes(params.get("theme")) ? params.get("theme") : "dark";
document.documentElement.dataset.theme = theme;
if (params.get("bg") && /^(transparent|#[0-9a-fA-F]{3,8})$/.test(params.get("bg"))) {
  document.documentElement.style.setProperty("--page", params.get("bg"));
}
const key = params.get("key") || "";
const $id = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const HISTORY = 60;
const MAX_DOTS = 10;
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function split(bps) {
  for (const [u, n] of [["Gbps", 1e9], ["Mbps", 1e6], ["Kbps", 1e3]]) {
    if (bps >= n) { const v = bps / n; return [v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2), u]; }
  }
  return [String(Math.round(bps)), "bps"];
}

// ---- 数字平滑过渡 ----
const tweens = new Map();
function animate(el, unitEl, target) {
  const from = tweens.has(el) ? tweens.get(el).current : target;
  const t = { from, to: target, current: from, start: performance.now() };
  tweens.set(el, t);
  const dur = reduceMotion ? 0 : 650;
  const step = (now) => {
    if (tweens.get(el) !== t) return;
    const p = dur ? Math.min(1, (now - t.start) / dur) : 1;
    const e = 1 - Math.pow(1 - p, 3);
    t.current = t.from + (t.to - t.from) * e;
    const [v, u] = split(t.current);
    el.textContent = v;
    if (unitEl) unitEl.textContent = u;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---- 每个组一行，DOM 只建一次，之后原地更新 ----
const rows = new Map();
function rowFor(name) {
  if (rows.has(name)) return rows.get(name);
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `
    <div class="g"><div class="gname" title="${esc(name)}">${esc(name)}</div><div class="dots"></div></div>
    <svg class="chart" viewBox="0 0 300 38" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="37" x2="300" y2="37" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
      <path class="area" fill="var(--rx)" fill-opacity="0.14"></path>
      <polyline class="lrx" fill="none" stroke="var(--rx)" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
      <polyline class="ltx" fill="none" stroke="var(--tx)" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
    </svg>
    <div class="num rx"><span class="lbl">下行</span><b>0</b><small>Mbps</small></div>
    <div class="num tx"><span class="lbl">上行</span><b>0</b><small>Mbps</small></div>`;
  const r = { el, hist: [], dots: el.querySelector(".dots"), area: el.querySelector(".area"),
    lrx: el.querySelector(".lrx"), ltx: el.querySelector(".ltx"),
    rxB: el.querySelector(".rx b"), rxU: el.querySelector(".rx small"),
    txB: el.querySelector(".tx b"), txU: el.querySelector(".tx small") };
  rows.set(name, r);
  return r;
}
function drawChart(r) {
  const h = r.hist, W = 300, H = 38, step = W / (HISTORY - 1), off = HISTORY - h.length;
  if (h.length < 2) { r.area.setAttribute("d", ""); r.lrx.setAttribute("points", ""); r.ltx.setAttribute("points", ""); return; }
  const max = Math.max(1, ...h.map((p) => Math.max(p.rx, p.tx))) * 1.12;
  const y = (v) => (H - 2 - (v / max) * (H - 6)).toFixed(1);
  const pts = (k) => h.map((p, i) => `${((off + i) * step).toFixed(1)},${y(p[k])}`).join(" ");
  const rx = pts("rx");
  r.lrx.setAttribute("points", rx);
  r.ltx.setAttribute("points", pts("tx"));
  r.area.setAttribute("d", `M${(off * step).toFixed(1)},${H} L${rx.replace(/ /g, " L")} L${W},${H} Z`);
}
function drawDots(r, g) {
  if (g.total > MAX_DOTS) {
    r.dots.innerHTML = `<i class="${g.online ? "on" : ""}"></i><span>${g.online}/${g.total} 在线</span>`;
  } else {
    r.dots.innerHTML = Array.from({ length: g.total }, (_, i) => `<i class="${i < g.online ? "on" : ""}"></i>`).join("")
      + `<span>${g.online ? `${g.online}/${g.total} 在线` : "离线"}</span>`;
  }
}

function render(data) {
  $id("title").textContent = data.title || "实时速率";
  document.title = data.title || "实时速率";
  const box = $id("rows");
  if (!data.groups.length) {
    box.innerHTML = ""; rows.clear();
    $id("msg").textContent = "暂无数据"; $id("msg").hidden = false;
  } else {
    $id("msg").hidden = true;
  }
  let srx = 0, stx = 0, son = 0, stot = 0;
  const names = new Set();
  data.groups.forEach((g, idx) => {
    names.add(g.name);
    const r = rowFor(g.name);
    if (box.children[idx] !== r.el) box.insertBefore(r.el, box.children[idx] || null);
    r.hist = r.hist.concat([{ rx: g.rx_bps, tx: g.tx_bps }]).slice(-HISTORY);
    r.el.classList.toggle("offline", g.online === 0);
    animate(r.rxB, r.rxU, g.rx_bps);
    animate(r.txB, r.txU, g.tx_bps);
    drawDots(r, g);
    drawChart(r);
    srx += g.rx_bps; stx += g.tx_bps; son += g.online; stot += g.total;
  });
  for (const [n, r] of rows) if (!names.has(n)) { r.el.remove(); rows.delete(n); }
  animate($id("sum-rx"), $id("sum-rx-u"), srx);
  animate($id("sum-tx"), $id("sum-tx-u"), stx);
  $id("sum-on").textContent = son;
  $id("sum-total").textContent = `/ ${stot}`;
}

function showLive(ok, note) {
  $id("live").classList.toggle("stale", !ok);
  $id("foot-note").textContent = note;
}
function onData(data) {
  render(data);
  $id("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  showLive(true, "数据每秒推送");
}
function showInvalid() {
  $id("rows").innerHTML = ""; rows.clear();
  $id("msg").textContent = "速率页未开启或链接无效"; $id("msg").hidden = false;
  showLive(false, "");
}

// 先确认链接有效，再建立 SSE 推送（每秒一次）；SSE 不可用时退回每 2 秒轮询
let es = null;
let timer = null;
async function check() {
  try {
    const res = await fetch(`/api/public/traffic?key=${encodeURIComponent(key)}`, { cache: "no-store" });
    if (res.status === 404) { showInvalid(); return false; }
    onData(await res.json());
    return true;
  } catch (_) {
    showLive(false, "连接中断，重试中…");
    return null;
  }
}
async function start() {
  clearTimeout(timer);
  const ok = await check();
  if (ok === false) return void (timer = setTimeout(start, 30000));
  if (ok === null) return void (timer = setTimeout(start, 3000));
  if (!window.EventSource) return poll();
  let got = false;
  es = new EventSource(`/api/public/traffic/stream?key=${encodeURIComponent(key)}`);
  es.onmessage = (e) => { got = true; try { onData(JSON.parse(e.data)); } catch (_) {} };
  es.addEventListener("closed", () => { es.close(); showInvalid(); timer = setTimeout(start, 30000); });
  es.onerror = () => {
    showLive(false, "连接中断，重试中…");
    if (!got) { es.close(); poll(); }
  };
}
async function poll() {
  const ok = await check();
  if (ok === false) return void (timer = setTimeout(start, 30000));
  if (ok) showLive(true, "数据每 2 秒更新");
  timer = setTimeout(poll, 2000);
}
start();
</script>
</body>
</html>
